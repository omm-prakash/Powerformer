n_workers: 0
random_seed: 11
result_dir: '/scratch/opsahoo.eee20.itbhu/Thesis'
test_mode: true
desc: "Detect Fault: contining expt-4 to all data"

task: 'detect' # e.g. "detect" or "locate"

dataset:
  data_path: '/scratch/opsahoo.eee20.itbhu/Thesis/test_dataset'
  data_names: ['folder1'] 
  window_size: 25
  stride: 12
  n_nodes: 6
  n_edges: 5
  n_edge_features: 3
  n_node_features: 3
  # node_features: ['N1_rms[kV]', 'N2_rms[kV]', 'N3_rms[kV]',     # node 1: 0
  #                 'N4_rms[kV]', 'N5_rms[kV]', 'N6_rms[kV]',     # node 2: 1
  #                 'N7_rms[kV]', 'N8_rms[kV]', 'N9_rms[kV]',     # node 3: 2
  #                 'N16_rms[kV]','N17_rms[kV]', 'N18_rms[kV]',   # node 6: 3
  #                 'N19_rms[kV]',  'N20_rms[kV]', 'N21_rms[kV]'] # node 7: 4
  edge_index: [[1,1,1,1,1], [0,2,3,4,5]]

  edge_features: ['I121A_rms[kA]', 'I121B_rms[kA]', 'I121C_rms[kA]',    # TL 2-1
                  'I322A_rms[kA]', 'I322B_rms[kA]', 'I322C_rms[kA]',    # TL 2-3
                  'I423A_rms[kA]', 'I423B_rms[kA]', 'I423C_rms[kA]',    # TL 2-4
                  'I524A_rms[kA]', 'I524B_rms[kA]', 'I524C_rms[kA]',    # TL 2-5
                  'I2M5A_rms[kA]', 'I2M5B_rms[kA]', 'I2M5C_rms[kA]']    # TL 2-6
                  
  node_features: ['I121A_rms[kA]', 'I121B_rms[kA]', 'I121C_rms[kA]',    # node 1: 0
                  'I2M5A_rms[kA]', 'I2M5B_rms[kA]', 'I2M5C_rms[kA]',    # node 2: 2
                  'I322A_rms[kA]', 'I322B_rms[kA]', 'I322C_rms[kA]',    # node 3: 1
                  'I423A_rms[kA]', 'I423B_rms[kA]', 'I423C_rms[kA]',    # node 4: 1
                  'I524A_rms[kA]', 'I524B_rms[kA]', 'I524C_rms[kA]',    # node 5: 1
                  'I2M5A_rms[kA]', 'I2M5B_rms[kA]', 'I2M5C_rms[kA]']    # node 6: 2

  num_fault_types: 7
  num_fault_locations: 5
  case_range: [1,1000]  # Using a list instead of a tuple
  ignored_fault_locations: [] # Ignored faults locations 
  ignored_fault_types: [1] # Ignored faults locations 

  test_ratio: 0.2
  k: 3 # eigen vectors to consider for PE

model:
  d_model: 256
  n_heads: 8
  dropout: 0.3
  use_bias: true
  n_layers: 1

training:
  learning_rate: 0.0001
  label_smoothing: 0
  epochs: 2
  validation: true
  val_frequency: 1
  save_model: true
  save_frequency: 1

  l2_regularize: true
  l2_lambda: 0.001

  freeze_attentions: false
  freeze_attention_layers: [0,1,2] # list belongs to {0, 1, ..., n_layers-1}

  retrain_model: false
  pretrained_model_path: 'locate_results/expt-4| 2025-05-07 19:17/weights/epoch-180.pt'
  only_load_attention: false

  multi_gpu: false

fault:
  1: "steady_state"
  2: "LG-A"
  3: "LG-B"
  4: "LG-C"
  5: "LLLG"
  6: "LLG-AB"
  7: "LLG-AC"
