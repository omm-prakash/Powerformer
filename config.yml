                  'I343A_rms[kA]', 'I343B_rms[kA]', 'I343C_rms[kA]',    # TL 2-3
                  'S3IA_rms[kA]', 'S3IB_rms[kA]', 'S3IC_rms[kA]',       # TL 2-6
                  'I765A_rms[kA]', 'I765B_rms[kA]', 'I765C_rms[kA]',    # TL 5-6
                  'I656A_rms[kA]', 'I656B_rms[kA]', 'I656C_rms[kA]',]   # TL 5-4
                    
                  
  node_features: ['I121A_rms[kA]', 'I121B_rms[kA]', 'I121C_rms[kA]',    # node 1: 0
                  'I232A_rms[kA]', 'I232B_rms[kA]', 'I232C_rms[kA]',    # node 2: 2
                  'S3IA_rms[kA]', 'S3IB_rms[kA]', 'S3IC_rms[kA]',       # node 3: 2
                  'I343A_rms[kA]', 'I343B_rms[kA]', 'I343C_rms[kA]',    # node 4: 2
