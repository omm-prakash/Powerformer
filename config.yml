  num_fault_types: 8
  num_fault_locations: 8
  case_range: [1,100]  # Using a list instead of a tuple
  ignored_fault_locations: [] # Ignored faults locations 
  ignored_fault_types: [1] # Ignored faults types 

  test_ratio: 0.2
  k: 3 # eigen vectors to consider for PE

model:
  d_model: 256
  n_heads: 8
  dropout: 0.3
  use_bias: true
  n_layers: 1

training:
  learning_rate: 0.0001
  label_smoothing: 0
  epochs: 2
  validation: true
  val_frequency: 1
  save_model: true
  save_frequency: 1

  l2_regularize: true
  l2_lambda: 0.001

  freeze_attentions: false
  freeze_attention_layers: [0,1,2] # list belongs to {0, 1, ..., n_layers-1}

  retrain_model: false
  pretrained_model_path: 'locate_results/expt-4| 2025-05-07 19:17/weights/epoch-180.pt'
  only_load_attention: false

  multi_gpu: false

fault:
  0: "steady_state"
  1: "LG-A"
  2: "LG-B"
  4: "LG-C"
  3: "LLG-AB"
  5: "LLG-AC"
